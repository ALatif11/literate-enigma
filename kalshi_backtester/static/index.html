<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kalshi Command Center</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c10;--surface:#0d1318;--border:#1a2530;
  --accent:#00ff88;--accent2:#ff6b35;--accent3:#4da6ff;
  --text:#c8d8e8;--text-dim:#5a7080;
  --green:#00ff88;--red:#ff4455;--yellow:#ffd700;
  --font-mono:'Space Mono',monospace;--font-display:'Syne',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font-mono)}
.app{max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);position:relative;overflow:hidden}
.noise{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.header{padding:20px 20px 0;border-bottom:1px solid var(--border);position:relative;z-index:1}
.header-top{display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:12px}
.logo{font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.5px;color:#fff}
.logo span{color:var(--accent)}
.live-badge{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--accent);letter-spacing:2px}
.live-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.tabs{display:flex}
.tab{flex:1;padding:10px 4px;background:none;border:none;border-bottom:2px solid transparent;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);cursor:pointer;letter-spacing:1px;transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.content{flex:1;overflow-y:auto;padding:16px;position:relative;z-index:1}
.section-label{font-size:10px;letter-spacing:3px;color:var(--text-dim);margin-bottom:12px;font-family:var(--font-display)}
.header-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.refresh-btn{background:none;border:1px solid var(--border);border-radius:4px;padding:5px 10px;font-family:var(--font-mono);font-size:10px;color:var(--text-dim);cursor:pointer;letter-spacing:1px;transition:all .2s}
.refresh-btn:hover{border-color:var(--accent);color:var(--accent)}
.spinning{display:inline-block;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.market-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .2s,transform .15s;animation:fadeUp .3s ease both}
.market-card:active{transform:scale(.98)}
.market-card:hover,.market-card.selected{border-color:var(--accent)}
.market-card.selected{background:#0d1f18}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:10px}
.market-title{font-family:var(--font-display);font-size:13px;font-weight:600;color:#fff;flex:1;line-height:1.3}
.score-ring{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:16px;font-weight:800;border:2px solid;flex-shrink:0}
.ring-high{border-color:var(--green);color:var(--green);background:#0a1f14}
.ring-med{border-color:var(--yellow);color:var(--yellow);background:#1a1500}
.ring-low{border-color:var(--red);color:var(--red);background:#1a0a0a}
.card-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.meta-pill{font-size:10px;color:var(--text-dim);background:#111c24;padding:3px 7px;border-radius:3px}
.price-bar-bg{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.price-fill{height:100%;border-radius:2px;transition:width .5s}
.anomaly-flag{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--accent2);margin-top:8px;padding:3px 7px;border:1px solid var(--accent2);border-radius:3px}
.skeleton{background:linear-gradient(90deg,var(--surface) 25%,var(--border) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;height:90px;margin-bottom:10px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.info-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:24px;text-align:center;margin-bottom:12px}
.info-card.error{border-color:var(--red)}
.info-icon{font-size:32px;margin-bottom:10px;opacity:.6}
.info-title{font-family:var(--font-display);font-size:14px;font-weight:700;margin-bottom:6px}
.info-sub{font-size:11px;color:var(--text-dim);line-height:1.7}
.decision-panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;margin-bottom:12px}
.panel-title{font-size:10px;letter-spacing:2px;color:var(--text-dim);margin-bottom:12px;font-family:var(--font-display)}
.market-selected-header{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.market-selected-title{font-family:var(--font-display);font-size:14px;font-weight:700;color:#fff;line-height:1.4;flex:1}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.stat-box{background:#111c24;border-radius:6px;padding:10px}
.stat-label{font-size:9px;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:4px}
.stat-value{font-size:18px;font-weight:700;font-family:var(--font-display)}
.recommendation{border-radius:8px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:12px}
.rec-yes{background:#0a2018;border:1px solid var(--green)}
.rec-no{background:#200a0a;border:1px solid var(--red)}
.rec-pass{background:#1a1a0a;border:1px solid var(--yellow)}
.rec-icon{font-size:26px}
.rec-label{font-family:var(--font-display);font-size:20px;font-weight:800;letter-spacing:-.5px}
.rec-sub{font-size:10px;color:var(--text-dim);margin-top:2px}
.kelly-display{background:#111c24;border-radius:6px;padding:12px;margin-bottom:12px}
.kelly-label{font-size:9px;letter-spacing:2px;color:var(--text-dim);margin-bottom:6px}
.kelly-row{display:flex;align-items:center;gap:10px}
.kelly-bar-bg{flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.kelly-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent3),var(--accent));border-radius:3px;transition:width .6s}
.kelly-pct{font-size:14px;font-weight:700;font-family:var(--font-display);color:var(--accent);min-width:42px;text-align:right}
.breakdown-section{background:#111c24;border-radius:6px;padding:12px;margin-bottom:12px}
.breakdown-row{display:flex;align-items:center;gap:8px;margin-bottom:7px}
.breakdown-row:last-child{margin-bottom:0}
.breakdown-label{font-size:9px;letter-spacing:1px;color:var(--text-dim);width:72px;flex-shrink:0}
.breakdown-bar-bg{flex:1;height:4px;background:var(--border);border-radius:2px}
.breakdown-bar-fill{height:100%;border-radius:2px;background:var(--accent);transition:width .5s}
.breakdown-val{font-size:10px;color:var(--text-dim);width:32px;text-align:right}
.ai-box{background:#111c24;border-radius:6px;padding:12px;margin-bottom:12px}
.ai-label{font-size:9px;letter-spacing:2px;color:var(--accent3);margin-bottom:8px}
.ai-text{font-size:12px;line-height:1.6;color:var(--text)}
.ai-loading{display:flex;gap:4px;align-items:center;padding:4px 0}
.ai-dot{width:4px;height:4px;border-radius:50%;background:var(--accent3);animation:blink 1.2s infinite}
.ai-dot:nth-child(2){animation-delay:.2s}.ai-dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
.no-selection{text-align:center;padding:48px 20px;color:var(--text-dim);font-size:12px;line-height:1.8}
.no-sel-icon{font-size:36px;margin-bottom:12px;opacity:.4}
.perf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.perf-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px}
.perf-label{font-size:9px;letter-spacing:1.5px;color:var(--text-dim);margin-bottom:4px}
.perf-value{font-family:var(--font-display);font-size:22px;font-weight:800}
.c-green{color:var(--green)}.c-red{color:var(--red)}.c-blue{color:var(--accent3)}.c-yellow{color:var(--yellow)}
.cal-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:14px}
.cal-table th{font-size:9px;letter-spacing:1.5px;color:var(--text-dim);padding:6px 4px;text-align:left;border-bottom:1px solid var(--border)}
.cal-table td{padding:7px 4px;border-bottom:1px solid var(--border)}
.mini-chart{display:flex;align-items:flex-end;gap:2px;height:40px;margin-bottom:14px}
.bar-col{flex:1;border-radius:2px 2px 0 0;min-height:2px}
.trade-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:11px}
.t-outcome{font-weight:700;font-family:var(--font-display);font-size:12px}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--border)}
.setting-label{font-size:12px;color:var(--text)}
.setting-sub{font-size:10px;color:var(--text-dim);margin-top:2px}
.input-field{background:#111c24;border:1px solid var(--border);border-radius:4px;padding:6px 10px;font-family:var(--font-mono);font-size:12px;color:var(--accent);width:90px;text-align:right}
.input-field:focus{outline:none;border-color:var(--accent)}
.toggle{width:40px;height:22px;background:var(--border);border-radius:11px;position:relative;cursor:pointer;transition:background .2s;border:none}
.toggle.on{background:var(--accent)}
.toggle::after{content:'';position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:3px;left:3px;transition:left .2s}
.toggle.on::after{left:21px}
.collect-btn{width:100%;padding:12px;background:none;border:1px solid var(--accent);border-radius:6px;font-family:var(--font-mono);font-size:12px;color:var(--accent);cursor:pointer;letter-spacing:1px;transition:all .2s;margin-top:8px}
.collect-btn:disabled{border-color:var(--border);color:var(--text-dim);cursor:default}
.status-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:14px;margin-top:14px}
.status-row{display:flex;justify-content:space-between;padding:6px 0;font-size:11px;border-bottom:1px solid var(--border)}
.status-row:last-child{border-bottom:none}
.status-key{color:var(--text-dim)}
.ok{color:var(--green);font-size:10px}.warn{color:var(--red);font-size:10px}
.env-badge{font-size:10px;padding:2px 8px;border-radius:3px;font-family:var(--font-mono)}
.env-demo{color:var(--yellow);border:1px solid var(--yellow)}.env-prod{color:var(--green);border:1px solid var(--green)}
.bottom-nav{display:flex;border-top:1px solid var(--border);background:var(--surface);position:relative;z-index:10}
.nav-btn{flex:1;padding:12px 4px 16px;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--text-dim);font-family:var(--font-mono);font-size:9px;letter-spacing:.5px;transition:color .2s}
.nav-btn.active{color:var(--accent)}
.nav-icon{font-size:18px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const DEFAULT = { threshold:0.35, strategy:"underdog", kelly_fraction:0.25, bankroll_cents:0, stake_cents:100 };
const ring = s => s>=0.70?"ring-high":s>=0.50?"ring-med":"ring-low";
const pct  = v => `${(v*100).toFixed(1)}%`;
const usd  = c => `${c>=0?"":"-"}$${(Math.abs(c)/100).toFixed(2)}`;
const kfmt = v => `$${(v/1000).toFixed(0)}k`;

function App() {
  const [tab, setTab]           = useState("scanner");
  const [markets, setMarkets]   = useState([]);
  const [scanLoad, setScanLoad] = useState(false);
  const [scanErr,  setScanErr]  = useState(null);
  const [selected, setSelected] = useState(null);
  const [aiText,   setAiText]   = useState("");
  const [aiLoad,   setAiLoad]   = useState(false);
  const [bt,       setBt]       = useState(null);
  const [btLoad,   setBtLoad]   = useState(false);
  const [btErr,    setBtErr]    = useState(null);
  const [status,   setStatus]   = useState(null);
  const [collecting, setCollecting] = useState(false);
  const [settings, setSettings] = useState(() => {
    try { return { ...DEFAULT, ...JSON.parse(localStorage.getItem("kcc") || "{}") }; }
    catch { return DEFAULT; }
  });
  const debounce = useRef(null);
  const poll     = useRef(null);

  const save = s => { setSettings(s); localStorage.setItem("kcc", JSON.stringify(s)); };

  const fetchStatus = async () => {
    try { const r = await fetch("/api/status"); setStatus(await r.json()); } catch {}
  };

  const fetchMarkets = async () => {
    setScanLoad(true); setScanErr(null);
    try {
      const r = await fetch(`/api/scan?kelly_fraction=${settings.kelly_fraction}`);
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || "Failed");
      setMarkets(d.markets || []);
    } catch(e) { setScanErr(e.message); }
    setScanLoad(false);
  };

  const fetchBt = async (s=settings) => {
    setBtLoad(true); setBtErr(null);
    try {
      const q = new URLSearchParams({ threshold:s.threshold, strategy:s.strategy,
        bankroll_cents:s.bankroll_cents, kelly_fraction:s.kelly_fraction, stake_cents:s.stake_cents });
      const r = await fetch(`/api/backtest?${q}`);
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || "No data");
      setBt(d);
    } catch(e) { setBtErr(e.message); setBt(null); }
    setBtLoad(false);
  };

  const fetchAI = async m => {
    setAiLoad(true); setAiText("");
    try {
      const q = new URLSearchParams({ title:m.title, price:m.last_price_cents,
        volume:m.volume, hours_left:m.hours_left||0, score:m.score, category:m.category });
      const r = await fetch(`/api/market/${m.ticker}/ai?${q}`);
      const d = await r.json();
      if (!r.ok) throw new Error(d.detail || "AI unavailable");
      setAiText(d.analysis);
    } catch(e) { setAiText(`⚠ ${e.message}`); }
    setAiLoad(false);
  };

  useEffect(() => {
    if (tab==="scanner") { fetchMarkets(); fetchStatus(); }
    if (tab==="backtest") fetchBt();
    if (tab==="settings") fetchStatus();
  }, [tab]);

  const handleSettings = s => {
    save(s);
    if (tab==="backtest") {
      clearTimeout(debounce.current);
      debounce.current = setTimeout(() => fetchBt(s), 500);
    }
  };

  const handleSelect = m => { setSelected(m); setTab("decide"); fetchAI(m); };

  const handleCollect = async () => {
    setCollecting(true);
    try {
      await fetch("/api/collect", { method:"POST" });
      poll.current = setInterval(async () => {
        const r = await fetch("/api/status"); const d = await r.json(); setStatus(d);
        if (!d.collecting) { clearInterval(poll.current); setCollecting(false); }
      }, 3000);
    } catch { setCollecting(false); }
  };

  useEffect(() => () => { clearInterval(poll.current); clearTimeout(debounce.current); }, []);

  const rec = (() => {
    if (!selected) return null;
    if (selected.score < settings.threshold) return { label:"PASS",    sub:"Score below threshold",       icon:"⏸", cls:"rec-pass", col:"var(--yellow)" };
    if (selected.last_price_cents < 40)      return { label:"BUY YES", sub:"Underdog appears underpriced", icon:"↑", cls:"rec-yes",  col:"var(--green)"  };
    if (selected.last_price_cents > 60)      return { label:"BUY NO",  sub:"Favorite appears overpriced",  icon:"↓", cls:"rec-no",   col:"var(--red)"    };
    return                                          { label:"PASS",    sub:"Price near fair value",         icon:"⏸", cls:"rec-pass", col:"var(--yellow)" };
  })();

  const chartMax = bt ? Math.max(...(bt.trades||[]).map(t=>Math.abs(t.profit_cents)),1) : 1;

  /* ── Scanner Tab ── */
  const ScanTab = (
    <>
      <div className="header-controls">
        <div className="section-label">OPPORTUNITIES</div>
        <button className="refresh-btn" onClick={fetchMarkets} disabled={scanLoad}>
          <span className={scanLoad?"spinning":""}>⟳</span> SCAN
        </button>
      </div>
      {scanLoad && [1,2,3].map(i=><div key={i} className="skeleton"/>)}
      {scanErr && (
        <div className="info-card error">
          <div className="info-icon">⚠</div>
          <div className="info-title">Cannot reach Kalshi</div>
          <div className="info-sub">{scanErr}</div>
        </div>
      )}
      {!scanLoad && !scanErr && markets.length===0 && (
        <div className="info-card">
          <div className="info-icon">◎</div>
          <div className="info-title">No markets found</div>
          <div className="info-sub">Check API credentials in CONFIG,<br/>or tap SCAN to retry.</div>
        </div>
      )}
      {markets.map((m,i) => (
        <div key={m.ticker}
          className={`market-card${selected?.ticker===m.ticker?" selected":""}`}
          style={{animationDelay:`${i*.04}s`}}
          onClick={()=>handleSelect(m)}>
          <div className="card-top">
            <div className="market-title">{m.title}</div>
            <div className={`score-ring ${ring(m.score)}`}>{Math.round(m.score*100)}</div>
          </div>
          <div className="card-meta">
            <span className="meta-pill">{m.category}</span>
            <span className="meta-pill">{m.last_price_cents?.toFixed(0)}¢ YES</span>
            <span className="meta-pill">{kfmt(m.volume||0)} vol</span>
            {m.hours_left>0 && <span className="meta-pill">{m.hours_left?.toFixed(0)}h left</span>}
          </div>
          <div className="price-bar-bg">
            <div className="price-fill" style={{
              width:`${m.last_price_cents}%`,
              background: m.last_price_cents>50
                ? "linear-gradient(90deg,#1a3a28,var(--green))"
                : "linear-gradient(90deg,var(--red),#3a1a1a)"
            }}/>
          </div>
          {m.anomaly && <div className="anomaly-flag">⚡ ANOMALY</div>}
        </div>
      ))}
    </>
  );

  /* ── Decide Tab ── */
  const DecideTab = !selected ? (
    <div className="no-selection">
      <div className="no-sel-icon">◎</div>
      <div>Select a market from the Scanner<br/>to get a decision analysis</div>
    </div>
  ) : (
    <>
      <div className="decision-panel">
        <div className="panel-title">SELECTED MARKET</div>
        <div className="market-selected-header">
          <div className={`score-ring ${ring(selected.score)}`}>{Math.round(selected.score*100)}</div>
          <div className="market-selected-title">{selected.title}</div>
        </div>
        <div className="stats-grid">
          {[
            ["YES PRICE",  `${selected.last_price_cents?.toFixed(0)}¢`, selected.last_price_cents>50?"var(--green)":"var(--red)"],
            ["VOLUME",     kfmt(selected.volume||0),                    "var(--accent3)"],
            ["HOURS LEFT", `${(selected.hours_left||0).toFixed(0)}h`,   "var(--text)"],
            ["MODEL PROB", `${((selected.p_model||0)*100).toFixed(0)}%`,"var(--accent3)"],
          ].map(([l,v,c])=>(
            <div className="stat-box" key={l}>
              <div className="stat-label">{l}</div>
              <div className="stat-value" style={{color:c}}>{v}</div>
            </div>
          ))}
        </div>
        {rec && (
          <div className={`recommendation ${rec.cls}`}>
            <div className="rec-icon">{rec.icon}</div>
            <div>
              <div className="rec-label" style={{color:rec.col}}>{rec.label}</div>
              <div className="rec-sub">{rec.sub}</div>
            </div>
          </div>
        )}
        <div className="kelly-display">
          <div className="kelly-label">KELLY FRACTION (MAX {(settings.kelly_fraction*100).toFixed(0)}%)</div>
          <div className="kelly-row">
            <div className="kelly-bar-bg">
              <div className="kelly-bar-fill" style={{width:`${Math.min(100,(selected.kelly_pct||0)/(settings.kelly_fraction*100)*100)}%`}}/>
            </div>
            <div className="kelly-pct">{(selected.kelly_pct||0).toFixed(1)}%</div>
          </div>
        </div>
      </div>
      <div className="breakdown-section">
        <div className="panel-title">SCORE BREAKDOWN</div>
        {[
          ["PRICE DEV", selected.score_price_deviation||0],
          ["VOLUME",    selected.score_volume_factor||0],
          ["TIME",      selected.score_time_factor||0],
        ].map(([l,v])=>(
          <div className="breakdown-row" key={l}>
            <div className="breakdown-label">{l}</div>
            <div className="breakdown-bar-bg"><div className="breakdown-bar-fill" style={{width:`${v*100}%`}}/></div>
            <div className="breakdown-val">{v.toFixed(2)}</div>
          </div>
        ))}
      </div>
      <div className="ai-box">
        <div className="ai-label">◈ AI ANALYSIS</div>
        {aiLoad
          ? <div className="ai-loading"><div className="ai-dot"/><div className="ai-dot"/><div className="ai-dot"/></div>
          : <div className="ai-text">{aiText||"—"}</div>}
      </div>
    </>
  );

  /* ── Backtest Tab ── */
  const BacktestTab = (
    <>
      <div className="section-label">HISTORICAL PERFORMANCE</div>
      {btLoad && [1,2,3].map(i=><div key={i} className="skeleton" style={{height:60}}/>)}
      {btErr && (
        <div className="info-card error">
          <div className="info-icon">▦</div>
          <div className="info-title">No backtest data</div>
          <div className="info-sub">{btErr}<br/>Run <code>kalshi-bt collect</code> or tap COLLECT in CONFIG.</div>
        </div>
      )}
      {!btLoad && bt?.metrics && (
        <>
          <div className="perf-grid">
            {[
              ["WIN RATE",     pct(bt.metrics.win_rate),                                             bt.metrics.win_rate>=.5?"c-green":"c-red"],
              ["ROI",          (bt.metrics.roi>=0?"+":"")+pct(bt.metrics.roi),                       bt.metrics.roi>=0?"c-green":"c-red"],
              ["SHARPE",       bt.metrics.sharpe!=null?bt.metrics.sharpe.toFixed(2):"N/A",           "c-blue"],
              ["PROF FACTOR",  bt.metrics.profit_factor!=null?bt.metrics.profit_factor.toFixed(2):"∞","c-yellow"],
              ["MAX DRAWDOWN", pct(bt.metrics.max_drawdown),                                          "c-red"],
              ["BRIER",        bt.metrics.brier_score.toFixed(4)+(bt.metrics.brier_score<.25?" ✓":" ✗"), bt.metrics.brier_score<.25?"c-green":"c-yellow"],
            ].map(([l,v,c])=>(
              <div className="perf-card" key={l}>
                <div className="perf-label">{l}</div>
                <div className={`perf-value ${c}`}>{v}</div>
              </div>
            ))}
          </div>
          {bt.calibration?.length>1 && (
            <>
              <div className="section-label">CALIBRATION</div>
              <table className="cal-table">
                <thead><tr><th>BUCKET</th><th>N</th><th>p_model</th><th>WIN RATE</th></tr></thead>
                <tbody>
                  {bt.calibration.map(r=>(
                    <tr key={r.bucket}>
                      <td>{r.bucket}</td>
                      <td>{r.count}</td>
                      <td>{(r.avg_p_model*100).toFixed(0)}%</td>
                      <td style={{color:r.actual_win_rate>=r.avg_p_model?"var(--green)":"var(--red)"}}>
                        {pct(r.actual_win_rate)}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </>
          )}
          <div className="section-label">P&amp;L PER TRADE</div>
          <div className="mini-chart">
            {(bt.trades||[]).slice(0,40).map((t,i)=>(
              <div key={i} className="bar-col" style={{
                height:`${(Math.abs(t.profit_cents)/chartMax)*100}%`,
                background:t.won?"var(--green)":"var(--red)",opacity:.85
              }}/>
            ))}
          </div>
          <div className="section-label">TRADE LOG</div>
          {(bt.trades||[]).slice(0,20).map((t,i)=>(
            <div className="trade-row" key={i}>
              <div>
                <div style={{fontSize:11,color:"var(--text)"}}>{t.ticker}</div>
                <div style={{fontSize:10,color:"var(--text-dim)",marginTop:2}}>
                  {t.score.toFixed(2)} · {t.direction.toUpperCase()} @ {t.entry_price_cents.toFixed(0)}¢
                </div>
              </div>
              <div className={`t-outcome ${t.won?"c-green":"c-red"}`}>
                {t.profit_cents>=0?"+":""}{usd(t.profit_cents)}
              </div>
            </div>
          ))}
        </>
      )}
    </>
  );

  /* ── Config Tab ── */
  const numField = (label, sub, val, onChange, {step=1,min=0,max=99999}={}) => (
    <div className="setting-row" key={label}>
      <div><div className="setting-label">{label}</div><div className="setting-sub">{sub}</div></div>
      <input className="input-field" type="number" step={step} min={min} max={max}
        value={val} onChange={e=>onChange(parseFloat(e.target.value)||0)}/>
    </div>
  );

  const ConfigTab = (
    <>
      <div className="section-label">STRATEGY</div>
      {numField("Score Threshold","Min score to trade (0–1)",settings.threshold,
        v=>handleSettings({...settings,threshold:v}),{step:0.05,min:0,max:1})}
      {numField("Fixed Stake ($)","Per-trade stake when bankroll=0",settings.stake_cents/100,
        v=>handleSettings({...settings,stake_cents:Math.round(v*100)}),{step:1,min:1})}
      {numField("Bankroll ($)","0 = fixed stake · >0 = Kelly sizing",settings.bankroll_cents/100,
        v=>handleSettings({...settings,bankroll_cents:Math.round(v*100)}),{step:10,min:0})}
      {numField("Kelly Fraction","0.25 = quarter-Kelly (recommended)",settings.kelly_fraction,
        v=>handleSettings({...settings,kelly_fraction:v}),{step:0.05,min:0.05,max:1})}
      <div className="setting-row">
        <div>
          <div className="setting-label">Strategy</div>
          <div className="setting-sub">{settings.strategy==="underdog"?"Buy the cheaper side (<50¢)":"Buy the favoured side (>50¢)"}</div>
        </div>
        <button className={`toggle${settings.strategy==="underdog"?" on":""}`}
          onClick={()=>handleSettings({...settings,strategy:settings.strategy==="underdog"?"favorite":"underdog"})}/>
      </div>
      <div className="section-label" style={{marginTop:20}}>DATA</div>
      <button className="collect-btn" onClick={handleCollect} disabled={collecting}>
        {collecting?"⟳ COLLECTING...":"⬇ COLLECT HISTORICAL MARKETS"}
      </button>
      {status && (
        <div className="status-card">
          {[
            ["Environment", <span className={`env-badge ${status.env==="prod"?"env-prod":"env-demo"}`}>{(status.env||"demo").toUpperCase()}</span>],
            ["Kalshi API",  <span className={status.api_configured?"ok":"warn"}>{status.api_configured?"✓ configured":"✗ missing"}</span>],
            ["Claude AI",   <span className={status.anthropic_configured?"ok":"warn"}>{status.anthropic_configured?"✓ configured":"✗ missing"}</span>],
            ["Markets stored", <span style={{color:"var(--text)"}}>{(status.market_count||0).toLocaleString()}</span>],
            ["Last collected", <span style={{color:"var(--text)"}}>{status.last_collected?new Date(status.last_collected).toLocaleDateString():"never"}</span>],
          ].map(([k,v])=>(
            <div className="status-row" key={k}><span className="status-key">{k}</span>{v}</div>
          ))}
        </div>
      )}
      <div style={{marginTop:16,padding:12,background:"var(--surface)",borderRadius:8,border:"1px solid var(--border)"}}>
        <div style={{fontSize:10,color:"var(--text-dim)",letterSpacing:1,marginBottom:6}}>ABOUT</div>
        <div style={{fontSize:11,color:"var(--text-dim)",lineHeight:1.7}}>
          KALSHI.AI — prediction market command center.<br/>
          Kelly sizing · Claude AI · Brier calibration.<br/>
          <span style={{color:"var(--accent)"}}>Always verify before trading real money.</span>
        </div>
      </div>
    </>
  );

  /* ── Layout ── */
  return (
    <>
      <div className="app">
        <div className="noise"/>
        <div className="header">
          <div className="header-top">
            <div className="logo">KALSHI<span>.</span>AI</div>
            <div className="live-badge"><div className="live-dot"/>LIVE</div>
          </div>
          <div className="tabs">
            {[["scanner","SCAN"],["decide","DECIDE"],["backtest","BACKTEST"],["settings","CONFIG"]].map(([id,l])=>(
              <button key={id} className={`tab${tab===id?" active":""}`} onClick={()=>setTab(id)}>{l}</button>
            ))}
          </div>
        </div>
        <div className="content">
          {tab==="scanner" && ScanTab}
          {tab==="decide"  && DecideTab}
          {tab==="backtest"&& BacktestTab}
          {tab==="settings"&& ConfigTab}
        </div>
        <div className="bottom-nav">
          {[["scanner","◎","SCAN"],["decide","⊕","DECIDE"],["backtest","▦","BACKTEST"],["settings","⚙","CONFIG"]].map(([id,icon,l])=>(
            <button key={id} className={`nav-btn${tab===id?" active":""}`} onClick={()=>setTab(id)}>
              <span className="nav-icon">{icon}</span>{l}
            </button>
          ))}
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
