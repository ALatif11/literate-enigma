[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kalshi-backtester"
version = "0.1.0"
description = "Kalshi prediction market backtester CLI"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "requests>=2.28",
    "python-dotenv>=1.0",
    "cryptography>=41.0",
    "tabulate>=0.9",
]

[project.scripts]
kalshi-bt = "kalshi_backtester.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["kalshi_backtester"]
